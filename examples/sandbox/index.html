<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#9fc9e8" />
    <title>Cubit sandbox</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="crosshair" aria-hidden="true"></div>
      <div id="panel">
        <strong>Cubit sandbox</strong>
        <div class="row">
          <button id="save" type="button">Save</button>
          <button id="load" type="button">Load</button>
          <button id="new" type="button">New world</button>
        </div>
        <div id="status" role="status"></div>
      </div>
      <div id="stats"></div>
      <div id="hotbar"></div>
      <div id="overlay">
        <div class="card">
          <h1>Click to play</h1>
          <p>WASD to move, Space to jump, mouse to look.</p>
          <p>Left click removes a block, right click places one. 1 to 8 picks a block. Esc frees the mouse.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
